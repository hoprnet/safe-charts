apiVersion: v1
kind: Secret
metadata:
  name: {{ include "safe-client-gateway.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "safe-client-gateway.labels" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- .Values.commonLabels | toYaml | nindent 4 }}
    {{- end }}
{{- if .Values.commonAnnotations }}
  annotations:
    {{- .Values.commonAnnotations | toYaml | nindent 4 }}
{{- end }}
type: Opaque
data:
  AUTH_TOKEN: {{ .Values.config.authToken | b64enc }}
  {{- if .Values.config.jwt.issuer }}
  JWT_ISSUER: {{ .Values.config.jwt.issuer | b64enc }}
  {{- end }}
  {{- if .Values.config.jwt.secret }}
  JWT_SECRET: {{ .Values.config.jwt.secret | b64enc }}
  {{- end }}

