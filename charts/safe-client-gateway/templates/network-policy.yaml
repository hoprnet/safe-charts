{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "safe-client-gateway.fullname" . }}-allow-ingress
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "safe-client-gateway.labels" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- .Values.commonLabels | toYaml | nindent 4 }}
    {{- end }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ include "safe-client-gateway.name" . }}
      app.kubernetes.io/name: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingress.namespace }}
          podSelector:
            matchLabels:
              {{- .Values.networkPolicy.ingress.podSelector | toYaml | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.ports.number }}
{{- end }}
