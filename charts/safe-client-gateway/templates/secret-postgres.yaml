---
{{- if not .Values.postgres.secretReferenceKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "safe-client-gateway.postgres-secret" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "safe-client-gateway.labels" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- .Values.commonLabels | toYaml | nindent 4 }}
    {{- end }}
{{- if .Values.commonAnnotations }}
  annotations:
    {{- .Values.commonAnnotations | toYaml | nindent 4 }}
{{- end }}
type: Opaque
data:
  POSTGRES_HOST: {{ .Values.postgres.host | b64enc | quote }}
  POSTGRES_PORT: {{ .Values.postgres.port | toString | b64enc | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | b64enc | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | b64enc | quote }}
{{- end }}
