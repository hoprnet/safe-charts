name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-pr
  cancel-in-progress: true

jobs:
  # Keeps the `Merge gate` check name present in every repository so the
  # ruleset can require it uniformly (hoprnet/hopr-devops#372). It grows
  # a `needs:` list when the repository gets real PR jobs.
  merge-gate:
    name: Merge gate
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
